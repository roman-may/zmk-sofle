draw_config:
  n_columns: 1
  draw_key_sides: true
  key_w: 60.0
  key_h: 56.0
  split_gap: 30.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 40.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  svg_extra_style: |
    /* For default sytles, see https://github.com/caksoylar/keymap-drawer/blob/main/keymap_drawer/config.py#L85 */

    svg.keymap {
      font-family: Ubuntu Mono, Inconsolata, Consolas, Liberation Mono, Menlo, monospace;
      font-size: 12px;
      font-weight: bold;
      text-rendering: optimizeLegibility;
    }

    /* Color accent for held keys */
    rect.held, rect.combo.held {
        fill: #ffc;
    }

    /* Hide positions with no physical keycap: the central joystick/D-pad
       cluster and the rotary encoder (the none-bound keys). */
    g.key.none {
        display: none;
    }

    /* Technique borrowed and extended from https://github.com/englmaxi/zmk-config/blob/master/keymap-drawer/config.yaml */
    .sym_sub_text.tap {
      translate: -5px 2px;
      font-size: 20px;
    }
    .sym_sub_text.shifted {
      translate: 10px 13px;
      font-size: 10px;
      opacity: 1.0;
    }
    /* Variant for symbol next to symbol */
    .sym_by_sym.tap {
      translate: -6px 0px;
    }
    .sym_by_sym.shifted {
      translate: 10px 12px;
      opacity: 1.0;
    }

  shrink_wide_legends: 6
  glyph_tap_size: 18
  glyph_hold_size: 15
  glyph_shifted_size: 15
  glyphs: {}
  glyph_urls:
    tabler: https://unpkg.com/@tabler/icons/icons/outline/{}.svg
    tablerf: https://unpkg.com/@tabler/icons/icons/filled/{}.svg
    mdi: https://raw.githubusercontent.com/Templarian/MaterialDesign-SVG/master/svg/{}.svg
    mdil: https://raw.githubusercontent.com/Pictogrammers/MaterialDesignLight/master/svg/{}.svg
    material: https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/{}/default/48px.svg
  use_local_cache: true

parse_config:
  mark_alternate_layer_activators: true
  trans_legend:
    tap: $$mdi:transfer$$
    type: trans

  raw_binding_map:
    # EurKEY umlauts via AltGr (RA). keymap-drawer can't resolve the locale,
    # so label them explicitly.
    "&kp RA(U)": "ü"
    "&kp RA(O)": "ö"
    "&kp RA(A)": "ä"
    "&hmr RSHFT RA(O)":
      tap: "ö"
      hold: "⇧"

    # Empty positions (joystick / encoder; also hidden via CSS)
    "&none":
      tap: $$mdi:minus-circle-outline$$
      type: none

    # Bluetooth selection (adjust layer)
    "&bt BT_SEL 0":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 1
    "&bt BT_SEL 1":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 2
    "&bt BT_SEL 2":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 3
    "&bt BT_SEL 3":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 4
    "&bt BT_SEL 4":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 5

    # Reset / bootloader (adjust layer)
    "&sys_reset":
      type: bootloader
      tap: $$mdi:backup-restore$$
    "&bootloader":
      tap: $$mdi:progress-download$$

  zmk_keycode_map:
    # Symbols (symbol layer)
    GRAVE:
      tap: "`"
      shifted: "~"
    TILDE: "~"
    LT: "<"
    GT: ">"
    PIPE: "|"
    AMPS: "&"
    CARET: "^"
    LBRC: "{"
    RBRC: "}"
    LBKT:
      tap: "["
      shifted: "{"
    RBKT:
      tap: "]"
      shifted: "}"
    EXCL: "!"
    QMARK: "?"
    EQUAL:
      tap: "="
      shifted: "+"
    PLUS: "+"
    FSLH:
      tap: "/"
      shifted: "?"
    AT: "@"
    HASH: "#"
    LPAR: "("
    RPAR: ")"
    DQT: '"'
    DLLR: "$"
    PRCNT: "%"
    ASTRK: "*"
    BSLH:
      tap: '\'
      shifted: "|"
    SQT:
      tap: "'"
      shifted: '"'
    COMMA:
      tap: ","
      shifted: "<"
    DOT:
      tap: "."
      shifted: ">"
    MINUS:
      tap: "-"
      shifted: "_"

    # Number row (base layer)
    N1:
      tap: 1
      shifted: "!"
    N2:
      tap: 2
      shifted: "@"
    N3:
      tap: 3
      shifted: "#"
    N4:
      tap: 4
      shifted: "$"
    N5:
      tap: 5
      shifted: "%"
    N6:
      tap: 6
      shifted: "^"
    N7:
      tap: 7
      shifted: "&"
    N8:
      tap: 8
      shifted: "*"
    N9:
      tap: 9
      shifted: "("
    N0:
      tap: 0
      shifted: ")"

    # Home-row modifiers
    LSHFT: $$mdi:apple-keyboard-shift$$
    LCTRL: $$mdi:apple-keyboard-control$$
    LALT: $$mdi:apple-keyboard-option$$
    LGUI: $$mdi:apple-keyboard-command$$
    RSHFT: $$mdi:apple-keyboard-shift$$
    RCTRL: $$mdi:apple-keyboard-control$$
    RGUI: $$mdi:apple-keyboard-command$$

    # Arrows (nav layer)
    UP: $$mdi:arrow-up-bold$$
    DOWN: $$mdi:arrow-down-bold$$
    LEFT: $$mdi:arrow-left-bold$$
    RIGHT: $$mdi:arrow-right-bold$$

    # Whitespace / editing
    ESC: $$mdi:keyboard-esc$$
    TAB: $$mdi:keyboard-tab$$
    RET:
      type: enter
      tap: $$mdi:keyboard-return$$
    SPACE: $$mdi:keyboard-space$$
    BSPC:
      type: backspace
      tap: $$mdi:backspace$$
    DEL: $$mdi:backspace-reverse-outline$$
    CAPS: $$mdi:apple-keyboard-caps$$

    # Bluetooth clear (adjust layer)
    BT_CLR: $$mdi:bluetooth-off$$
